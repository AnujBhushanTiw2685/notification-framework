<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>CI/CD Failure Notification</title>

<style>

body{

font-family:Arial,Helvetica,sans-serif;
background:#f5f5f5;
padding:40px;

}

.container{

max-width:900px;
margin:auto;
background:white;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,.1);

}

.header{

background:#d32f2f;
color:white;
padding:20px;
font-size:28px;
font-weight:bold;
text-align:center;

}

.section{

padding:25px;

}

table{

width:100%;
border-collapse:collapse;

}

td{

padding:12px;
border:1px solid #ddd;

}

.label{

font-weight:bold;
background:#f7f7f7;
width:220px;

}

.error{

background:#fff5f5;
border-left:6px solid red;
padding:15px;
font-family:Consolas;
white-space:pre-wrap;

}

.footer{

padding:20px;
text-align:center;
font-size:12px;
color:#666;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

🚨 CI/CD FAILURE NOTIFICATION

</div>

<div class="section">

<table>

<tr>

<td class="label">

Component

</td>

<td>

{{COMPONENT}}

</td>

</tr>

<tr>

<td class="label">

Job

</td>

<td>

{{JOB}}

</td>

</tr>

<tr>

<td class="label">

Status

</td>

<td>

{{STATUS}}

</td>

</tr>

<tr>

<td class="label">

Timestamp

</td>

<td>

{{TIMESTAMP}}

</td>

</tr>

<tr>

<td class="label">

Exit Code

</td>

<td>

{{EXIT_CODE}}

</td>

</tr>

</table>

<br>

<h3>Error</h3>

<div class="error">

{{ERROR}}

</div>

</div>

<div class="footer">

Generated automatically by CI/CD Notification Framework

</div>

</div>

</body>

</html>
