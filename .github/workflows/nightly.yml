name: Nightly Component Orchestrator

on:
  workflow_dispatch:

env:
    OWNER: ${{ github.repository_owner }}
    COMPONENTS: "component1 component2 component3 component4 component5"
    EVENT_TYPE: nightly-run
    WAIT_TIME: 60

jobs:
  nightly:

    runs-on: ubuntu-latest

    steps:

        - name: Checkout Repository
          uses: actions/checkout@v4

            # Trigger Nightly Pipelines

        - name: Trigger Nightly Pipelines
          env:
                GH_PAT: ${{ secrets.NOTIFICATION_FRAMEWORK_TOKEN }}

          run: |

                for repo in $COMPONENTS
                do
                    echo "==================================="
                    echo "Triggering $repo..."
                    echo "==================================="

                    curl -L \
                        -X POST \
                        -H "Accept: application/vnd.github+json" \
                        -H "Authorization: Bearer $GH_PAT" \
                        -H "X-GitHub-Api-Version: 2022-11-28" \
                        https://api.github.com/repos/$OWNER/$repo/dispatches \
                        -d "{\"event_type\":\"$EVENT_TYPE\"}"
                    echo

                done

        # Wait for all workflows to finish

        - name: Wait for Completion
          run: |
            
            echo "Waiting for $WAIT_TIME seconds..."
            sleep $WAIT_TIME

        # Collect workflow status

        - name: Collect Component Status
          env:
            OWNER: ${{ env.OWNER }}
            COMPONENTS: ${{ env.COMPONENTS }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


          run: |
            
            python scripts/collect_nightly_status.py

        - name: Upload Nightly Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: nightly-artifacts
            path: artifacts/
          
